name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests
        run: ./test/host/run.sh

  fuzz-smoke:
    name: Fuzz smoke (RX path)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Run RX-path fuzz smoke
        run: CC=clang-18 RUNS=1000000 ./test/host/fuzz/run.sh

  build-examples:
    name: Build ${{ matrix.path }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { path: examples/basic_controller, target: esp32,   command: "idf.py build" }
          - { path: examples/basic_controller, target: esp32s3, command: "idf.py build" }
          - { path: examples/basic_controller, target: esp32c3, command: "idf.py build" }
          - { path: examples/basic_satellite,  target: esp32,   command: "idf.py build" }
          - { path: examples/basic_satellite,  target: esp32s3, command: "idf.py build" }
          - { path: examples/basic_satellite,  target: esp32c3, command: "idf.py build" }
          # HIL builds exercise the CONFIG_ESPNOW_MESH_HIL_TEST_ENABLE code paths.
          - { path: examples/hil_bench, target: esp32, command: "idf.py -DSDKCONFIG_DEFAULTS=configs/device0-controller-hil.defaults build" }
          - { path: examples/hil_bench, target: esp32, command: "idf.py -DSDKCONFIG_DEFAULTS=configs/device1-satellite-hil.defaults build" }
    steps:
      - uses: actions/checkout@v4
      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: ${{ matrix.command }}
