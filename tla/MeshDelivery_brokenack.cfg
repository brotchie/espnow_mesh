\* Same model but with note_ack's sequence filter removed (FilterAcksBySeq =
\* FALSE). EXPECTED: NoFalseCompletion VIOLATED - a stale ACK from an earlier
\* sequence is miscounted, so the controller declares a sequence complete
\* that a satellite never received. Demonstrates the #2 filter is load-bearing.
SPECIFICATION Spec
CONSTANTS
    Sats = {1, 2}
    MaxSeq = 2
    SendRetries = 2
    MaxAttempts = 3
    FilterAcksBySeq = FALSE
INVARIANT TypeOK
INVARIANT NoFalseCompletion
