\* Single controller that may reboot and change channel; satellite may start
\* on the wrong channel; SoftAP discovery required. EXPECTED: all pass -
\* lock integrity (#3), discovery progress (#9), time-sync liveness and
\* re-sync after reboot (#10).
SPECIFICATION FairSpec
CONSTANTS
    Ctls = {1}
    Channels = {1, 2}
    MaxBoot = 2
    SoftApRequired = TRUE
    EnforceLock = TRUE
INVARIANT TypeOK
INVARIANT LockIntegrity
PROPERTY DiscoveryProgress
PROPERTY EventuallySynced
PROPERTY ReSyncLiveness
