\* Two controller MACs present on the satellite's channel (extra-controller
\* scenario) with the shipped lock check. EXPECTED: LockIntegrity holds - the
\* satellite locks to one MAC and ignores the other. No reboots needed; this
\* is a pure safety run.
SPECIFICATION Spec
CONSTANTS
    Ctls = {1, 2}
    Channels = {1}
    MaxBoot = 1
    SoftApRequired = TRUE
    EnforceLock = TRUE
INVARIANT TypeOK
INVARIANT LockIntegrity
