\* Reliable-delivery core with the shipped note_ack (sequence-filtered).
\* EXPECTED: all pass - dedup sound (#1), bounded effort (#5), no false
\* completion (#2), eventual delivery under fair channel (#7).
SPECIFICATION FairSpec
CONSTANTS
    Sats = {1, 2}
    MaxSeq = 2
    SendRetries = 2
    MaxAttempts = 3
    FilterAcksBySeq = TRUE
INVARIANT TypeOK
INVARIANT DedupSoundness
INVARIANT BoundedEffort
INVARIANT NoFalseCompletion
PROPERTY EventualDelivery
