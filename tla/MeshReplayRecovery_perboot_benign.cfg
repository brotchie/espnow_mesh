\* Proposed fix under a benign channel: confirms the per-boot-id high-water
\* mark does NOT sacrifice R1 recovery. EXPECTED: all pass - genuinely fresh
\* boot ids start from an empty high-water mark, so a real reboot still
\* re-locks and resumes delivery.
SPECIFICATION FairSpec
CONSTANTS
    MaxBoot = 2
    MaxSeq = 2
    Channels = {1, 2}
    InitChannel = 1
    SwitchRule = "perboot"
    KConsec = 2
    ReplayAdversary = FALSE
INVARIANT TypeOK
INVARIANT DedupSoundness
PROPERTY UnlockRecovery
PROPERTY DeliveryRecovery
