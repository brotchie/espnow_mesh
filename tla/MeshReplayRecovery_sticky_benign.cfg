\* Deliberately over-strict rule: never switch boot ids once one is adopted.
\* Closes the replay hole (DedupSoundness holds) but EXPECTED: DeliveryRecovery
\* VIOLATED - after a genuine controller reboot the satellite is stuck on the
\* dead boot id and never resumes. This is the R1-vs-replay tension the plan
\* predicts: too strict a switch rule breaks recovery.
SPECIFICATION FairSpec
CONSTANTS
    MaxBoot = 2
    MaxSeq = 2
    Channels = {1, 2}
    InitChannel = 1
    SwitchRule = "sticky"
    KConsec = 2
    ReplayAdversary = FALSE
INVARIANT TypeOK
INVARIANT DedupSoundness
PROPERTY UnlockRecovery
PROPERTY DeliveryRecovery
