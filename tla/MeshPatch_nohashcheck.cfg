\* Broken satellite: become READY once all block indices are present, skipping
\* the full-patch hash check (CheckFullHash = FALSE), with a stale block in
\* play. EXPECTED: ApplyIntegrity VIOLATED - a satellite applies a corrupted
\* assembly. Validates the pre-READY full-patch hash verification (#6b).
SPECIFICATION Spec
CONSTANTS
    Sats = {1, 2}
    NumBlocks = 2
    RequireAllReady = TRUE
    CheckFullHash = FALSE
    AllowStaleBlocks = TRUE
INVARIANT TypeOK
INVARIANT ApplyIntegrity
