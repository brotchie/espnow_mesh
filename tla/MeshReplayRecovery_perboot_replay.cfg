\* Proposed fix: persisted per-boot-id high-water mark (the "monotonic
\* counter" variant). Checked against the replay adversary.
\* EXPECTED: DedupSoundness holds - replaying an old authenticated frame
\* restores that boot's stored high-water mark, so the replay is a duplicate.
SPECIFICATION Spec
CONSTANTS
    MaxBoot = 2
    MaxSeq = 2
    Channels = {1, 2}
    InitChannel = 1
    SwitchRule = "perboot"
    KConsec = 2
    ReplayAdversary = TRUE
INVARIANT TypeOK
INVARIANT DedupSoundness
